name = "match-generator"
main = "src/index.ts"
account_id = '8a93337e5cf183625e3ce2b4ffe43284'
workers_dev = true
compatibility_date = "2026-10-19"

[env.production.vars]
DATABASE = "animasters"
DEFAULT_SONGS_AMOUNT = "10"
DEFAULT_REPEAT_ANIMES = "false"
DEFAULT_INCLUDE_OPENINGS = "true"
DEFAULT_INCLUDE_ENDINGS = "true"
DEFAULT_INCLUDE_SOUNDTRACK = "true"


[observability]
enabled = true

# Each room code routes to one persistent SQLite-backed lobby.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1-rooms"
new_sqlite_classes = ["Room"]

[[env.production.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[vars]
ROOM_ORIGINS = "https://animasters.pages.dev,http://localhost:3000,http://127.0.0.1:3000,http://localhost:4173,http://127.0.0.1:4173"
